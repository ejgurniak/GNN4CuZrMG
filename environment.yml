# Usage: conda env create --name gnn-mg -f environment.yml

name: gnn-mg
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11.7
  - pytorch::pytorch=2.1.1
  - pytorch::torchvision=0.16.1
  - pytorch::torchaudio=2.1.1
  - pytorch::pytorch-cuda=11.8
  - pytorch::ignite=0.4.13
  - numpy>=1.26.4,<2.0
  - scikit-learn=1.4.0
  - pymatgen=2023.12.18
  - pydantic=2.5.3
  - natsort=8.4.0
  - pip:
    - torch_geometric
